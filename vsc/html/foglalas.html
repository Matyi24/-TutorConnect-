<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/fogalas.css">
    <title>TutorConnect</title>
</head>

<body>
<div class="dashboard-section">
        <h2 class="section-title">Válasszon egyet:</h2>
        
        <div class="tutor-cards-container">
            <!-- 1. Kártya: Közelgő foglalásaim -->
            <a href="foglalasutan" class="tutor-card">
                <div class="card-icon">📅</div>
                <div class="card-content">
                    <h3>Közelgő foglalásaim</h3>
                    <span class="card-arrow">&rarr;</span>
                </div>
            </a>

            <!-- 2. Kártya: Függőben lévő foglalásaim -->
            <a href="foglalasutan" class="tutor-card">
                <div class="card-icon">⏳</div>
                <div class="card-content">
                    <h3>Függőben lévő foglalásaim</h3>
                    <span class="card-arrow">&rarr;</span>
                </div>
            </a>

            <!-- 3. Kártya: Lemondott foglalásaim -->
            <a href="foglalasutan" class="tutor-card">
                <div class="card-icon">❌</div>
                <div class="card-content">
                    <h3>Lemondott foglalásaim</h3>
                    <span class="card-arrow">&rarr;</span>
                </div>
            </a>

            <!-- 4. Kártya: Korábbi foglalásaim -->
            <a href="foglalasutan" class="tutor-card">
                <div class="card-icon">📁</div>
                <div class="card-content">
                    <h3>Korábbi foglalásaim</h3>
                    <span class="card-arrow">&rarr;</span>
                </div>
            </a>
        </div>
    </div>

</body>
<script src="/js/creator.js"></script>

</html>
