<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/style.css">
    <title>Regisztráció</title>
  </head>
  <body>
    <main class="container">
      <h1 class="title">Regisztráció</h1>
      <div class="register_text">Van már Tutor Connect fiókod? <a href="/login">Jelentkezz be.</a></div>

      
      <form id="registerForm" action="/register" method="POST">
        <div class="field">
          <label for="name">Név:</label>
          <input type="text" id="name" name="name" placeholder="Pl: Arany János" required>
        </div>
        
        <div class="field">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="példa@gmail.com" required>
        </div>
        
        <div class="field">
          <label for="password">Jelszó:</label>
          <input type="password" id="password" name="password" placeholder="Ide írd be a jelszavad" required>
        </div>
        
        <div class="field">
          <label for="password_confirm">Jelszó megerősítése:</label>
          <input type="password" id="password_confirm" name="password_confirm" placeholder="Ismételd meg a jelszavad" required>
        </div>
        
        
        <div class="field">
          <label for="role">Ennek regisztrálok:</label>
          <select id="role" name="role">
            <option value="STUDENT">Diák</option>
            <option value="TUTOR">Korrepetáló</option>
          </select>
        </div>
        
        <div id="error-message" style="color: red; margin-bottom: 15px;"></div>

        <button type="submit" class="signin-btn">Regisztrálok</button>
    </form>
  </main>
</body>
<script src="/js/creator.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('password_confirm');
    const errorMessage = document.getElementById('error-message');

    form.addEventListener('submit', function(event) {
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      // Criteria:
      // (?=.*[0-9]) -> At least one digit
      // (?=.*[^a-zA-Z0-9]) -> At least one special character
      // .{6,} -> Minimum 6 characters long
      const strongPasswordPattern = /^(?=.*[0-9])(?=.*[^a-zA-Z0-9]).{6,}$/;

      if (!strongPasswordPattern.test(password)) {
        event.preventDefault(); // no submit till password is strong^^^^^^^^^^
        errorMessage.textContent = "A jelszónak legalább 6 karakterből kell állnia, és tartalmaznia kell legalább 1 számot és 1 speciális karaktert (!, $, stb.)!";
        return;
      }

      if (password !== confirmPassword) {
        event.preventDefault(); // no submit till password is correct
        errorMessage.textContent = "A két jelszó nem egyezik meg!";
        return;
      }
      errorMessage.textContent = "";
    });
  </script>
</html>
