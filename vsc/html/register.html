<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
    <title>Regisztráció</title>
  </head>
  <body>
    <main class="container">
      <h1 class="title">Regisztráció</h1>
      <div class="register_text">Van már Tutor Connect fiókod? <a href="/login">Jelentkezz be.</a></div>

      
      <form id="registerForm" action="/register" method="POST">
        <div class="field">
          <label for="name">Név:</label>
          <input type="text" id="name" name="name" placeholder="Pl: Arany János" required>
        </div>
        
        <div class="field">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="példa@gmail.com" required>
        </div>
        
        <div class="field">
          <label for="password">Jelszó:</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="Ide írd be a jelszavad" required>
            <button type="button" class="toggle-password" aria-label="Jelszó megjelenítése" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        
        <div class="field">
          <label for="password_confirm">Jelszó megerősítése:</label>
          <div class="password-wrap">
            <input type="password" id="password_confirm" name="password_confirm" placeholder="Ismételd meg a jelszavad" required>
            <button type="button" class="toggle-password" aria-label="Jelszó megjelenítése" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        
        
        <div class="field">
          <label for="role">Ennek regisztrálok:</label>
          <select id="role" name="role">
            <option value="STUDENT">Diák</option>
            <option value="TUTOR">Korrepetáló</option>
          </select>
        </div>
        
        <div id="error-message" style="color: red; margin-bottom: 15px;"></div>

        <button type="submit" class="signin-btn">Regisztrálok</button>
    </form>
  </main>
</body>
<script src="/js/creator.js"></script>
  <script>
  // Jelszó megjelenítése / elrejtése (szem ikon)
  document.querySelectorAll('.toggle-password').forEach(function (button) {
    button.addEventListener('click', function () {
      const input = button.parentElement.querySelector('input');
      const show = input.type === 'password';

      input.type = show ? 'text' : 'password';
      button.classList.toggle('is-visible', show);
      button.setAttribute('aria-pressed', String(show));
      button.setAttribute('aria-label', show ? 'Jelszó elrejtése' : 'Jelszó megjelenítése');
    });
  });

  const params = new URLSearchParams(window.location.search);
  const role = params.get('role');
  if (role) {
    document.getElementById('role').value = role;
  }

    const form = document.getElementById('registerForm');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('password_confirm');
    const errorMessage = document.getElementById('error-message');

    form.addEventListener('submit', function(event) {
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      // (?=.*[0-9]) -> At least one digit
      // (?=.*[^a-zA-Z0-9]) -> At least one special character
      // .{6,} -> Min 6 characters long
      const strongPasswordPattern = /^(?=.*[0-9])(?=.*[^a-zA-Z0-9]).{6,}$/;

      if (!strongPasswordPattern.test(password)) {
        event.preventDefault(); // no submit till password is strong^^^^^^^^^^
        errorMessage.textContent = "A jelszónak legalább 6 karakterből kell állnia, és tartalmaznia kell legalább 1 számot és 1 speciális karaktert (!, $, stb.)!";
        return;
      }
      errorMessage.textContent = "";
    });
  </script>
</html>
