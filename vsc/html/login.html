<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">

    <title>Tutor Connect — Bejelentkezés</title>
</head>

<body>

<main class="container">

    <div class="ambient" aria-hidden="true"></div>

    <h1 class="title">Jelentkezz be.</h1>

    <p class="account_create">
        Még nincs Tutor Connect fiókod?
        <a href="/register">Regisztrálj.</a>
    </p>

    <form action="/login" method="POST">

        <div class="field">
            <label for="email">Email</label>

            <input
                id="email"
                name="email"
                type="email"
                placeholder="pelda@email.com"
                autocomplete="email"
                required
            >
        </div>

        <div class="field">
            <label for="password">Jelszó</label>

            <div class="password-wrap">
                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Írd be a jelszavad"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    aria-label="Jelszó megjelenítése"
                    aria-pressed="false"
                >
                    <svg
                        class="icon-eye"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>

                    <svg
                        class="icon-eye-off"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                        <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
            </div>
        </div>

        <button type="submit" class="signin-btn">
            Bejelentkezem.
        </button>

    </form>

</main>

<script src="/js/creator.js"></script>
<script>
  // Jelszó megjelenítése / elrejtése (szem ikon)
  document.querySelectorAll('.toggle-password').forEach(function (button) {
    button.addEventListener('click', function () {
      const input = button.parentElement.querySelector('input');
      const show = input.type === 'password';

      input.type = show ? 'text' : 'password';
      button.classList.toggle('is-visible', show);
      button.setAttribute('aria-pressed', String(show));
      button.setAttribute('aria-label', show ? 'Jelszó elrejtése' : 'Jelszó megjelenítése');
    });
  });
</script>
<script src="/js/login.js"></script>

</body>
</html>
