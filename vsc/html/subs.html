<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/substyle.css">
    <title>TutorConnect</title>
</head>

<body>
        <!--nav-->
<main class="container">
        <!--hero-->
        <div class="subhero">
            <h1>Válassz tantárgyat !</h1>
            <p>Találj megbízható korrepetálót percek alatt, vagy ajánld fel segítségedet a diákoknak!</p>
        </div>

        <!--Tartalom-->

        <div class="category">

            <div class="subject-selector">
                <span id="selectedSubject">
                    Minden tárgy
                </span>

                <button id="dropdownButton" class="dropdown-button">
                    <span class="arrow">⌄</span>
                </button>

                <div id="dropdownMenu" class="dropdown-menu">
                    <div class="dropdown-item">Minden tárgy</div>
                    <div class="dropdown-item">Reál</div>
                    <div class="dropdown-item">Humán</div>
                    <div class="dropdown-item">Nyelvek</div>
                    <div class="dropdown-item">Természettudomány</div>
                    <div class="dropdown-item">Művészet</div>
                    <div class="dropdown-item">Gazdaság</div>
                    <div class="dropdown-item">Egyéb</div>
                </div>
            </div>

        </div>

        <div class="grid-container">


        </div>

        <!-- Footer -->

    </main>
</body>
<script src="/js/creator.js"></script>
<script src="/js/dropdown.js"></script>
<script src="/js/index.js"></script>

</html>
