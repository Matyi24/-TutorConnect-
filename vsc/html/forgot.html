<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">

    <title>Elfelejtett jelszó – TutorConnect</title>
</head>

<body>

<main class="container">

    <div class="ambient" aria-hidden="true"></div>

    <h1 class="title">Elfelejtett jelszó</h1>

    <p class="account_create">
        Add meg az e-mail címed, és küldünk egy linket az új jelszó beállításához.
    </p>

    <form id="forgotForm" novalidate>

        <div class="field">
            <label for="email">Email</label>

            <input id="email" name="email" type="email" placeholder="pelda@email.com" autocomplete="email" required>
        </div>

        <div id="formError" class="form-error" role="alert"></div>
        <div id="formOk" class="form-ok" role="status" hidden></div>

        <button type="submit" class="signin-btn" id="submitBtn">Link küldése</button>

        <p class="auth-back"><a href="/login">← Vissza a bejelentkezéshez</a></p>

    </form>

</main>

<script src="/js/creator.js"></script>
<script>
    const form = document.getElementById('forgotForm');
    const errorBox = document.getElementById('formError');
    const okBox = document.getElementById('formOk');
    const button = document.getElementById('submitBtn');

    form.addEventListener('submit', async function (event) {

        event.preventDefault();

        errorBox.textContent = '';
        okBox.hidden = true;

        const email = document.getElementById('email').value.trim();

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            errorBox.textContent = 'Adj meg egy érvényes e-mail címet.';
            return;
        }

        button.disabled = true;

        try {

            const response = await fetch('/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            const data = await response.json();

            okBox.textContent = data.message || 'Elküldtük a levelet.';
            okBox.hidden = false;

        } catch (error) {

            errorBox.textContent = 'Nem sikerült a kérés. Próbáld újra később.';
            button.disabled = false;
        }
    });
</script>
</body>
</html>
